<div>
  <mat-button-toggle-group name="fontStyle" aria-label="Font Style" [(ngModel)]="switcher">
    @for (user of users; track i; let i = $index) {
      <mat-button-toggle [value]="user.id">{{ user?.name }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  <port-user-details [(parasha)]="switcher"></port-user-details>
  @if (switcherView()) {
    <p>{{ switcherView()?.name }}</p>
  }
</div>
